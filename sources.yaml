sources:
  # Keep the selected single-source policy, with no additional allowlist.
  # BlackMatrix7 Privacy normal/domain files are intentionally split;
  # a small normal payload alone does not indicate upstream truncation.
  - name: custom_adblock
    url: https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockmihomo.yaml
    parser: domain_payload
    max_bytes: 20000000
    max_rules: 750000
    required_types: [DOMAIN-SUFFIX]
    min_rules: 150000
    max_drop_ratio: 0.35
